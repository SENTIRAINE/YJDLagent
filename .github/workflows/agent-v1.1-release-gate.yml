name: Agent v1.1 release gate

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run_controlled_live:
        description: Run the production controlled smoke on the self-hosted release runner
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-v1.1-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-contract:
    name: Deterministic A01-A11 contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Agent test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run deterministic release acceptance
        shell: powershell
        run: .\scripts\agent-v1.1-sse-acceptance.ps1 -Mode Deterministic
      - name: Archive deterministic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-v1.1-deterministic-${{ github.run_id }}
          path: artifacts/agent-v1.1-acceptance/
          if-no-files-found: error
          retention-days: 90

  controlled-production-smoke:
    name: Real-model controlled production smoke
    needs: deterministic-contract
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_controlled_live) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, windows, production-agent]
    environment: agent-production-acceptance
    timeout-minutes: 45
    env:
      AGENT_BASE_URL: ${{ vars.AGENT_BASE_URL }}
      SPRING_BOOT_BASE_URL: ${{ vars.SPRING_BOOT_BASE_URL }}
      AGENT_ACCEPTANCE_EXPECTED_MODEL: ${{ vars.OPENAI_MODEL }}
      AGENT_ACCEPTANCE_TENANT_ID: ${{ vars.AGENT_ACCEPTANCE_TENANT_ID }}
      AGENT_ACCEPTANCE_USER_ID: ${{ vars.AGENT_ACCEPTANCE_USER_ID }}
      FRONTEND_EVIDENCE_PATH: ${{ vars.FRONTEND_EVIDENCE_PATH }}
      LANGGRAPH_SERVICE_TOKEN: ${{ secrets.LANGGRAPH_SERVICE_TOKEN }}
      AGENT_TOOL_SERVICE_TOKEN: ${{ secrets.AGENT_TOOL_SERVICE_TOKEN }}
      AGENT_TOOL_TIMEOUT_SECONDS: '125'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Agent acceptance dependencies
        run: python -m pip install -e ".[dev]"
      - name: Require controlled environment inputs
        shell: powershell
        run: |
          $required = @(
            'AGENT_BASE_URL',
            'SPRING_BOOT_BASE_URL',
            'AGENT_ACCEPTANCE_EXPECTED_MODEL',
            'FRONTEND_EVIDENCE_PATH',
            'LANGGRAPH_SERVICE_TOKEN',
            'AGENT_TOOL_SERVICE_TOKEN'
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Missing controlled acceptance configuration: $($missing -join ', ')"
          }
          if (-not (Test-Path -LiteralPath $env:FRONTEND_EVIDENCE_PATH -PathType Leaf)) {
            throw "Frontend evidence does not exist: $env:FRONTEND_EVIDENCE_PATH"
          }
      - name: Run live A01-A11 release gate
        shell: powershell
        run: |
          .\scripts\agent-v1.1-sse-acceptance.ps1 `
            -Mode Live `
            -RequireProductionFixtures `
            -RequireFrontendEvidence `
            -FrontendEvidencePath $env:FRONTEND_EVIDENCE_PATH
      - name: Archive production release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-v1.1-production-evidence-${{ github.run_id }}
          path: artifacts/agent-v1.1-acceptance/
          if-no-files-found: error
          retention-days: 365
