[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yjdl-langgraph-rag"
version = "0.1.0"
description = "LangGraph RAG service for the YJDL knowledge base"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "langgraph>=0.4,<1",
  "langgraph-checkpoint-sqlite>=3,<4",
  "numpy>=1.26,<3",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "pymongo>=4.10,<5",
  "redis>=5,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "mongomock>=4.3,<5"]

[project.scripts]
rag-build = "app.cli.build_index:main"
rag-query = "app.cli.query:main"
agent-store-migrate = "app.cli.migrate_agent_store:main"
agent-worker = "app.cli.agent_worker:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
